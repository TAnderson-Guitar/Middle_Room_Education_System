<!DOCTYPE html>
<html>
<head>
    <title>Logged Out</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #EEF5FF;
            animation: fadeIn 0.8s ease-out forwards;
            opacity: 0;
            margin: 0;
            padding: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logout-box {
            max-width: 450px;
            margin: 120px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 10px;
            font-weight: 600;
        }

        p {
            font-size: 15px;
            color: #444;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #4a6cf7;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            transition: 0.2s;
            font-weight: 500;
        }

        .btn:hover {
            background: #3a56c9;
        }
    </style>
</head>
<body>
    <div class="logout-box">
        <h1>Goodbye, {{ username }}!</h1>
        <p>You’ve been logged out successfully.</p>
        <a href="/login" class="btn">Return to Login</a>
    </div>
</body>
</html>
