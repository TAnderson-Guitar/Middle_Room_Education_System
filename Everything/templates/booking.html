<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Middle Room System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
<link rel="shortcut icon" href="https://edu.sites.moodlecentral.com.au/ap/schools/nsw/quakershil-h/pluginfile.php/1/theme_moove/favicon/1772497795/QHHS%20Logo.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

{% include "header.html" %}

<body>

<div class="banner">
    <h1>Middle Room Booking</h1>
</div>

<div class="container mt-4">

    <div class="alert alert-success">
        Training completed ✓ | Test passed ✓
    </div>

    <div class="row">
        <div class="col-md-8">
            <h3>Select a Day & Time</h3>

            <table class="table table-bordered text-center align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Day</th>
                        <th>Recess</th>
                        <th>Lunch</th>
                    </tr>
                </thead>
                <tbody>
                    {% for day in days %}
                    <tr>
                        <td>{{ day }}</td>
                        {% for slot in slots %}
                        <td>
                            <button 
                                class="btn btn-primary btn-sm booking-btn"
                                id="{{ day|lower }}_{{ slot|lower }}"
                            >
                                Book {{ slot }}
                            </button>

                        </td>
                        {% endfor %}
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="col-md-4">
            <h3>Middle Room Reservations</h3>
            <ul id="myBookings" class="list-group">
                <li class="list-group-item">Loading...</li>
            </ul>
        </div>
    </div>
</div>

<script>

document.querySelectorAll(".booking-btn").forEach(btn => {
    const [day, slot] = btn.id.split("_");

    btn.dataset.day = day.charAt(0).toUpperCase() + day.slice(1);
    btn.dataset.slot = slot.charAt(0).toUpperCase() + slot.slice(1);

    btn.dataset.original = `Book ${btn.dataset.slot}`;
    btn.innerText = btn.dataset.original;

    btn.onclick = () => book(btn.dataset.day, btn.dataset.slot);
});


async function book(day, slot) {
    const res = await fetch("/api/book", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ day, slot })
    });

    const data = await res.json();
    alert(data.message);
    loadBookings();
}

async function cancelBooking(id) {
    const res = await fetch("/api/cancel_booking", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ id })
    });

    const data = await res.json();
    if (!data.success) alert(data.message);

    loadBookings();
}

async function loadBookings() {

    // 1. FETCH FIRST — prevents blue flash
    const allBookings = await (await fetch("/api/all_bookings")).json();
    const myBookings  = await (await fetch("/api/my_bookings")).json();

    // 2. Update right-side list
    const list = document.getElementById("myBookings");
    list.innerHTML = "";

    if (myBookings.length === 0) {
        list.innerHTML = "<li class='list-group-item'>No reservations yet.</li>";
    } else {
        myBookings.forEach(b => {
            list.innerHTML += `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    ${b.day} — ${b.slot}
                    <button class="btn btn-danger btn-sm" onclick="cancelBooking(${b.id})">Cancel</button>
                </li>
            `;
        });
    }

    // 3. Reset all buttons AFTER fetch
    document.querySelectorAll(".booking-btn").forEach(btn => {
        btn.innerText = btn.dataset.original;
        btn.disabled = false;
        btn.className = "btn btn-primary btn-sm booking-btn";
        btn.onclick = () => book(btn.dataset.day, btn.dataset.slot);
    });

    // 4. Apply booked states
    allBookings.forEach(b => {
        const btn = document.getElementById(`${b.day.toLowerCase()}_${b.slot.toLowerCase()}`);
        if (!btn) return;

        const isMine = myBookings.some(m => m.id === b.id);

        if (isMine) {
            btn.innerText = "Cancel";
            btn.className = "btn btn-danger btn-sm booking-btn";
            btn.disabled = false;
            btn.onclick = () => cancelBooking(b.id);
        } else {
            btn.innerText = `Booked by ${b.username}`;
            btn.className = "btn btn-secondary btn-sm booking-btn";
            btn.disabled = true;
            btn.onclick = null;
        }
    });
}

loadBookings();

</script>



</body>
</html>
