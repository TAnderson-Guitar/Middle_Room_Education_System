<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Middle Room Training</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
<link rel="shortcut icon" href="https://edu.sites.moodlecentral.com.au/ap/schools/nsw/quakershil-h/pluginfile.php/1/theme_moove/favicon/1772497795/QHHS%20Logo.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

{% include "header.html" %}

<body>

<div class="banner mb-4">
    <h1>Middle Room Training</h1>
</div>

<div class="container mt-5">

    <div class="text-center mb-4">
        <p class="lead">Learn how to safely and responsibly use the Middle Room before booking.</p>
    </div>

    {% for s in sections %}
    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <h4 class="fw-semibold mb-3">{{ s.title }}</h4>

            {% if s.image_path %}
            <img src="{{ url_for('static', filename='uploads/training/' + s.image_path) }}"
                 class="img-fluid rounded mb-3">
            {% endif %}

            <div>{{ s.content|safe }}</div>

        </div>
    </div>
    {% endfor %}

    <div class="text-center mb-5">
        <form method="POST">
            <button class="btn btn-success btn-lg px-5 py-2" type="submit">
                Training Completed - Continue to Test
            </button>
        </form>
    </div>

</div>

</body>
</html>
