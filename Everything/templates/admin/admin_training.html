{% include "header.html" %}

<div class="container mt-5 mb-5">
    <div class="card shadow p-4 pb-5" style="border-radius: 12px;">

        <h1 class="mb-4" style="color:#19244c; font-weight:700;">
            Training Content
        </h1>

        <!-- Add Section -->
        <form action="/admin/training/add" method="POST" class="mb-4">
            <div class="mb-3">
                <label class="form-label">Title</label>
                <input name="title" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Content</label>
                <textarea name="content" class="form-control" rows="4" required></textarea>
            </div>

            <button class="btn btn-primary">Add Section</button>
        </form>

        <hr>

        <!-- Existing Sections -->
        <div class="row g-4 mt-3">
            {% for s in sections %}
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm p-3 h-100">

                    <h5 style="color:#19244c;">{{ s.title }}</h5>
                    <p class="text-muted">{{ s.content[:150] }}...</p>

                    <div class="d-flex justify-content-between mt-auto">
                        <a href="/admin/training/edit/{{ s.id }}" class="btn btn-warning btn-sm">Edit</a>

                        <form action="/admin/training/delete/{{ s.id }}" method="POST">
                            <button class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </div>

                </div>
            </div>
            {% endfor %}
        </div>

    </div>
</div>
