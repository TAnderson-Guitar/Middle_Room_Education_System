{% include "header.html" %}

<script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>

<script>
tinymce.init({
    selector: '#contentEditor',
    plugins: 'lists link image',
    menubar: false,
    toolbar: 'undo redo | bold italic | bullist numlist | link | removeformat',
    valid_elements: 'p,ul,ol,li,b,strong,i,em,a[href],img[src|alt],h1,h2,h3,h4,h5,h6',
    forced_root_block: 'p'
});
</script>

<div class="container mt-5 mb-5">
    <div class="card shadow p-4 pb-5" style="border-radius: 12px;">

        <h1 class="mb-4" style="color:#19244c; font-weight:700;">
            Edit Training Section
        </h1>

        <form method="POST" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">Title</label>
                <input name="title" class="form-control" value="{{ section.title }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Content</label>
                <textarea id="contentEditor" name="content" class="form-control" rows="10">{{ section.content }}</textarea>
            </div>

            {% if section.image_path %}
            <div class="mb-3">
                <label class="form-label">Current Image</label><br>
                <img src="{{ url_for('static', filename='uploads/training/' + section.image_path) }}"
                     class="img-fluid rounded mb-2" style="max-height:200px;">
            </div>
            {% endif %}

            <div class="mb-3">
                <label class="form-label">Upload New Image (optional)</label>
                <input type="file" name="image" class="form-control">
            </div>

            <button class="btn btn-primary">Save Changes</button>
            <a href="/admin/training" class="btn btn-secondary">Cancel</a>

        </form>

    </div>
</div>
