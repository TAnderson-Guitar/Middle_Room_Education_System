<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Middle Room Test</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
<link rel="shortcut icon" href="https://edu.sites.moodlecentral.com.au/ap/schools/nsw/quakershil-h/pluginfile.php/1/theme_moove/favicon/1772497795/QHHS%20Logo.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
{% include "header.html" %}

<div class="container mt-5 mb-5">
    <div class="card shadow p-4 pb-5" style="border-radius: 12px;">

        <h1 class="mb-4" style="color:#19244c; font-weight:700;">
            Middle Room Test
        </h1>

        <form method="POST">

            {% for q in questions %}
            <div class="mb-4 p-3 border rounded">

                <h5 class="fw-semibold">{{ loop.index }}. {{ q.question }}</h5>

                <div class="form-check mt-2">
                    <input class="form-check-input" type="radio" name="{{ q.id }}" value="a" required>
                    <label class="form-check-label">A. {{ q.option_a }}</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="{{ q.id }}" value="b">
                    <label class="form-check-label">B. {{ q.option_b }}</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="{{ q.id }}" value="c">
                    <label class="form-check-label">C. {{ q.option_c }}</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="{{ q.id }}" value="d">
                    <label class="form-check-label">D. {{ q.option_d }}</label>
                </div>

            </div>
            {% endfor %}

            <button class="btn btn-success btn-lg px-5 py-2" type="submit">
                Submit Test
            </button>

        </form>

    </div>
</div>


</body>
</html>
